name: Construir APK Solar-Cuba

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compilar APK con Gradle (versión explícita)
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug
          build-root-directory: ./app
          gradle-version: 8.5   # <--- Fuerza la versión de Gradle (sin necesidad de wrapper)

      - name: Verificar APK generado
        run: ls -la app/build/outputs/apk/debug/

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SolarCuba-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
